<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF2EF">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milao">
<title>Milao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF2EF; --surface:#FFFBF9; --surface-2:#F7E8E4;
  --ink:#2B1A1D; --dim:#7B5D60; --faint:#A98C8E;
  --line:rgba(43,26,29,.15); --line-soft:rgba(43,26,29,.07);
  --teal:#B0203C; --teal-soft:#F8DEE3;
  --green:#2F7A50; --yellow:#B0761A; --red:#7E1F2C;
  --green-soft:#E2F0E6; --yellow-soft:#F8EBD4; --red-soft:#F5DFE1;
}
@media (prefers-color-scheme:dark){
  :root{
  --bg:#160F11; --surface:#1F1418; --surface-2:#271A1F;
  --ink:#F8EDEA; --dim:#C2A6A8; --faint:#8F7477;
  --line:rgba(248,237,234,.15); --line-soft:rgba(248,237,234,.07);
  --teal:#F2687D; --teal-soft:#3A1A23;
  --green:#6FBF8E; --yellow:#E0B25E; --red:#E58B95;
  --green-soft:#1B2C22; --yellow-soft:#33280F; --red-soft:#331A1E;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
@media (min-width:520px){body{background:var(--surface-2);display:flex;justify-content:center}}
#app{width:100%;max-width:480px;background:var(--bg);min-height:100dvh;display:flex;flex-direction:column;position:relative}
@media (min-width:520px){#app{box-shadow:0 0 0 1px var(--line)}}
main{flex:1;padding:16px 16px 128px;overflow-y:auto}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;margin:0}
h1{font-size:30px;line-height:1.08} h2{font-size:22px;line-height:1.15} h3{font-size:17px}
p{margin:0}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.dim{color:var(--dim)} .small{font-size:12.5px} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:10px;padding:13px 16px 0}
.brand{font-family:var(--serif);font-size:19px}
.brand i{color:var(--teal);font-style:normal}
.grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px}
.card.flat{background:var(--surface-2)}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
button{font-family:var(--sans);font-size:14.5px;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 14px;transition:transform .1s}
button:active{transform:scale(.985)}
button:disabled{opacity:.45;cursor:not-allowed}
.p{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
.b{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.ghost{background:transparent}
.w{width:100%}
.row{display:flex;gap:8px}.row>*{flex:1}
label.f{display:block;margin-bottom:11px}
label.f span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
input,select,textarea{width:100%;font-family:var(--sans);font-size:16px;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
textarea{resize:vertical;min-height:60px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:var(--surface-2);color:var(--dim);font-size:14px}
.seg button[aria-pressed=true]{background:var(--teal-soft);color:var(--teal);font-weight:600}
.chip{font-family:var(--mono);font-size:9.5px;padding:3px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.t{background:var(--teal-soft);border-color:transparent;color:var(--teal)}
/* slots */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.slot{border:1px solid var(--line);border-radius:16px;background:var(--surface);min-height:132px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--ink);cursor:pointer;position:relative;overflow:hidden}
.slot.full{grid-column:1/-1;min-height:auto}
.slot.empty{border-style:dashed;background:transparent}
.slot.searching{background:var(--teal-soft);border-color:transparent}
.slot.chat{background:var(--surface);border-color:var(--line)}
.slot .idx{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.slot .big{font-family:var(--serif);font-size:17px;line-height:1.15;margin-top:2px}
.slot .sub{font-size:11px;color:var(--dim);margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--teal-soft);color:var(--teal)}
.scorepill{font-family:var(--mono);font-size:15px;font-weight:500;padding:2px 9px;border-radius:99px}
.s-green{background:var(--green-soft);color:var(--green)}
.s-yellow{background:var(--yellow-soft);color:var(--yellow)}
.s-red{background:var(--red-soft);color:var(--red)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
/* chat */
.chatwrap{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;z-index:30}
.chathead{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;gap:10px;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.4;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.m.me{align-self:flex-end;background:var(--teal);color:#fff;border-color:var(--teal)}
.m .t{display:block;font-family:var(--mono);font-size:8.5px;opacity:.55;margin-top:3px}
.composer{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.composer input{flex:1}
.ended{text-align:center;padding:18px;color:var(--dim);font-size:13px}
/* misc */
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{flex:1;border:0;background:none;padding:7px 2px;color:var(--faint);font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;display:grid;gap:3px;justify-items:center;border-radius:10px}
nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button[aria-pressed=true]{color:var(--teal)}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);font-size:13px;padding:9px 14px;border-radius:99px;opacity:0;transition:.22s;pointer-events:none;z-index:60;font-family:var(--mono);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
.citylist{display:none;margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.cityrow{padding:11px 13px;font-size:14.5px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.cityrow:last-child{border-bottom:0}
.cityrow span{color:var(--faint);font-family:var(--mono);font-size:10px;margin-left:6px}
.pw{position:relative}
.pw input{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;cursor:pointer;color:var(--faint);line-height:0}
.eye svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
.eye.on{color:var(--teal)}
.avbtn{background:none;border:0;padding:0;line-height:0;cursor:pointer;border-radius:50%}
.avbtn svg{border-radius:50%;display:block}
.avempty{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--faint);font-size:18px;border:1px dashed var(--line)}
.langpick{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}
.langpick .chip{font-family:var(--mono);font-size:10px;padding:5px 9px}
.avchip{display:inline-flex;flex:0 0 auto;border-radius:50%;overflow:hidden;line-height:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--dim);cursor:pointer;font-family:var(--sans)}
.chip.on{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
a{color:var(--teal);text-decoration:none;border-bottom:1px solid rgba(176,32,60,.28)}
a:hover{border-bottom-color:var(--teal)}
a:visited{color:var(--teal)}
.empty{display:grid;place-content:center;text-align:center;height:100%;padding:0 26px;gap:4px}
.typing{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:400}
.sheet{position:fixed;inset:0;background:rgba(10,14,13,.45);display:flex;align-items:flex-end;z-index:50}
.sheet .inner{background:var(--surface);width:100%;max-width:480px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 18px 0;
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.sheet .foot{position:sticky;bottom:0;background:var(--surface);padding:10px 0 calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid var(--line-soft)}
.sheet .chip,.sheet .sw{touch-action:manipulation}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;font-size:14.5px;line-height:1.35;color:var(--ink)}
.opt[aria-pressed=true]{border-color:var(--teal);background:var(--teal-soft);font-weight:600;color:var(--teal)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{padding:14px 2px;font-family:var(--mono);font-size:13px;color:var(--dim)}
.scale button[aria-pressed=true]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.slegend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8.5px;text-transform:uppercase;color:var(--faint);margin-top:5px}
.q{font-family:var(--serif);font-size:21px;line-height:1.25;margin:12px 0 16px;min-height:60px}
.prog{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .4s}
.bar{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--teal)}
.tr{display:grid;grid-template-columns:96px 1fr 26px;gap:8px;align-items:center;font-size:11.5px;margin-bottom:6px}
.tr span:first-child{font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr span:last-child{text-align:right;font-family:var(--mono);font-size:10px;color:var(--faint)}
.kvd{border-bottom:1px solid var(--line-soft);padding:9px 0}
.kvd summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;align-items:baseline}
.kvd summary::-webkit-details-marker{display:none}
.kvd summary b{font-weight:600;display:flex;align-items:center;gap:6px;text-align:right}
.kvd summary i{font-style:normal;color:var(--faint);font-size:11px;transition:transform .15s}
.kvd[open] summary i{transform:rotate(180deg)}
.kvd p{margin:7px 0 0;line-height:1.55;color:var(--dim)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0}
.kv b{font-family:var(--mono);font-weight:500;font-size:12.5px}
.tiny{font-size:11px;color:var(--faint);line-height:1.5}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:12px 0}
.back{background:none;border:0;padding:0;color:var(--dim);font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div id="app">
  <div class="top" id="top"></div>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="toast"></div>
<div id="sheet"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS = [
  ['home', 'SLOT', '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'],
  ['tests', 'CHAR', '<path d="M9 4h6v3H9z"/><path d="M7 5H5v16h14V5h-2"/><path d="M9 12h6M9 16h4"/>'],
  ['profile', 'ME', '<path d="M12 12a4 4 0 100-8 4 4 0 000 8z"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>']
];

let S = {
  lang: localStorage.getItem('milao_lang') || 'en',
  token: localStorage.getItem('milao_token') || null,
  tab: 'home', authMode: 'signup', me: null, tests: null,
  state: null, chat: null, run: null, poll: null, chatPoll: null, busy: false, gender: 'Woman', pref: 'Men'
};

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' }, S.token ? { Authorization: 'Bearer ' + S.token } : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  let j = {}; try { j = await res.json(); } catch {}
  if (!res.ok) { const e = new Error(j.error || 'Something went wrong'); e.code = res.status; throw e; }
  return j;
}
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2000); }

/* ------------------------------ render ------------------------------ */
let lastKey = null;
function render() {
  const key = [S.token ? 1 : 0, S.tab, S.chat ? S.chat.id : '', S.run ? (S.run.test.id + S.run.i + (S.run.result ? 'r' : '')) : ''].join('|');
  const fresh = key !== lastKey;
  lastKey = key;
  const y = window.scrollY || document.documentElement.scrollTop || 0;
  const my = $('#main') ? $('#main').scrollTop : 0;
  const focused = document.activeElement && document.activeElement.id === 'msgbox';

  $('#top').innerHTML = topBar();
  $('#main').innerHTML = !S.token ? viewAuth() : (S.chat ? '' : viewTab());
  $('#nav').innerHTML = S.token && !S.chat ? navBar() : '';
  $('#nav').style.display = S.token && !S.chat ? 'flex' : 'none';
  if (S.chat) $('#main').insertAdjacentHTML('beforeend', viewChat());

  const box = $('#msgbox');
  if (box) { box.value = S.draft || ''; if (focused) box.focus(); }
  if (fresh) { window.scrollTo(0, 0); if ($('#main')) $('#main').scrollTop = 0; }
  else { window.scrollTo(0, y); if ($('#main')) $('#main').scrollTop = my; }
}
const topBar = () => `<span class="brand">Milao<i>.</i></span><span class="grow"></span>
  ${S.me ? `<span class="badge">${esc(S.me.cibil.tier)} · ${S.me.cibil.slots} slots</span>` : `<span class="lbl">strangers, sorted</span>`}`;
const navBar = () => TABS.map(([id, label, icon]) =>
  `<button data-act="tab" data-tab="${id}" aria-pressed="${S.tab === id}">
     <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>${t(id === 'home' ? 'slots' : id === 'tests' ? 'character' : 'me')}</button>`).join('');
function viewTab() {
  if (S.run) return S.run.result ? viewResult() : viewRun();
  if (S.tab === 'home') return viewHome();
  if (S.tab === 'tests') return viewTests();
  return viewProfile();
}

/* ------------------------------ auth ------------------------------ */
function viewAuth() {
  loadPlaces();
  if (S.authMode === 'otp') {
    return `<h1 style="margin-bottom:6px">Check your email.</h1>
      <p class="dim small" style="margin:8px 0 16px">We sent a six-digit code to <b>${esc(S.pendingEmail || '')}</b>. It expires in ten minutes.</p>
      ${S.devCode ? `<p class="tiny" style="margin-bottom:12px">No mail service configured — your code is <b>${esc(S.devCode)}</b></p>` : ''}
      <label class="f"><span>${t('code')}</span><input id="o-code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code"></label>
      <button class="p w" data-act="verifyotp">${t('verify')}</button>
      <button class="ghost w" style="margin-top:8px" data-act="authmode" data-v="signup">Back</button>`;
  }
  if (S.authMode === 'forgot') {
    return `<h1 style="margin-bottom:6px">Reset your password.</h1>
      <p class="dim small" style="margin:8px 0 16px">${S.resetSent ? 'Enter the code we emailed you, and a new password.' : 'We will email you a six-digit code.'}</p>
      ${S.resetSent ? `
        <label class="f"><span>code</span><input id="r-code" inputmode="numeric" maxlength="6" placeholder="000000"></label>
        <label class="f"><span>new password</span>
          <div class="pw"><input id="r-pass" type="password" placeholder="8 characters minimum"><button type="button" class="eye" data-act="togglepw" data-target="r-pass" aria-label="show password">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button></div>
        </label>
        <button class="p w" data-act="resetpass">Set new password</button>` : `
        <label class="f"><span>email</span><input id="r-email" type="email" placeholder="you@example.com"></label>
        <button class="p w" data-act="forgot">Send code</button>`}
      <button class="ghost w" style="margin-top:8px" data-act="authmode" data-v="login">Back to sign in</button>`;
  }
  const su = S.authMode === 'signup';
  return `
    <h1 style="margin-bottom:6px">${su ? 'Strangers, sorted<br>by character.' : 'Welcome back.'}</h1>
    <p class="dim small" style="margin:8px 0 16px">${su ? 'Fill in your birth details and your character, and we will show you how well you match the person you are about to talk to.' : 'Sign in to your slots.'}</p>
    ${langPicker()}
    <div class="seg" style="margin-bottom:14px">
      <button data-act="authmode" data-v="signup" aria-pressed="${su}">${t('signup')}</button>
      <button data-act="authmode" data-v="login" aria-pressed="${!su}">${t('signin')}</button>
    </div>
    ${su ? `
      <label class="f"><span>${t('email')}</span><input id="a-email" type="email" placeholder="you@example.com"></label>
      <label class="f"><span>${t('password')}</span>
        <div class="pw"><input id="a-pass" type="password" placeholder="8 characters minimum"><button type="button" class="eye" data-act="togglepw" data-target="a-pass" aria-label="show password">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button></div>
      </label>
      <div class="row">
        <label class="f"><span>${t('name')}</span><input id="a-name" maxlength="24" placeholder="Aarav"></label>
        <label class="f"><span>your age</span><input id="a-dob" type="date" value="1998-01-01"></label>
      </div>
      <label class="f"><span>${t('status')}</span><input id="a-status" maxlength="50" placeholder="Ask me about filter coffee"></label>
      <div class="row">
        <label class="f"><span>${t('iam')}</span>
          <div class="seg" id="a-gender"><button data-g="Woman" aria-pressed="true">Woman</button><button data-g="Man" aria-pressed="false">Man</button></div>
        </label>
        <label class="f"><span>${t('showme')}</span>
          <div class="seg" id="a-pref"><button data-p="Men" aria-pressed="true">Men</button><button data-p="Women" aria-pressed="false">Women</button><button data-p="Anyone" aria-pressed="false">Anyone</button></div>
        </label>
      </div>

/* ------------------------------ home ------------------------------ */
function viewHome() {
  const st = S.state;
  if (!st) return `<p class="lbl" style="text-align:center;padding:40px 0">loading</p>`;
  const done = Object.keys(S.me.results || {}).length;
  const total = S.tests ? S.tests.length : 5;
  return `
    ${done < total ? `<div class="card" style="background:var(--teal-soft);border-color:transparent">
      <div class="hd"><h3 style="color:var(--teal)">Your character is ${Math.round(done / total * 100)}% built</h3><span class="lbl" style="color:var(--teal)">${done}/${total}</span></div>
      <p class="small" style="margin-bottom:10px">Every test you finish sharpens the match score and lifts your tier. Finish them to unlock more slots.</p>
      <button class="p w" data-act="tab" data-tab="tests">Continue</button>
    </div>` : ''}
    <div class="hd" style="margin:2px 0 10px"><h2>${t('yourslots')}</h2><span class="lbl">${st.queueSize} ${t('waiting')}</span></div>
    <div class="slots">${st.slots.map(slotCard).join('')}</div>
    <p class="tiny">Tap an empty slot to join the queue — each slot keeps its own place in line. You are matched with whoever has been waiting longest who wants someone like you. Minimise a chat with ⌄ and it keeps running while you use your other slots.</p>`;
}

function slotCard(s) {
  if (s.chatId) {
    const band = s.band || 'yellow';
    return `<button class="slot chat full" data-act="openchat" data-id="${s.chatId}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="min-width:0">
          <div class="idx">slot ${s.index + 1} · talking</div>
          <div class="big">${esc(s.peer?.name || 'Someone')}</div>
          <div class="sub">${esc(s.peer?.status || '')}</div>
        </div>
        <span class="scorepill s-${band}">${s.score}</span>
      </div>
      <div class="sub" style="margin-top:8px">
        ${s.lastFrom === 'them' ? '<span class="chip t" style="margin-right:6px">new</span>' : ''}
        ${s.messages ? s.messages + ' message' + (s.messages > 1 ? 's' : '') : 'Say something first'}
      </div>
    </button>`;
  }
  if (s.queued) {
    return `<button class="slot searching" data-act="unqueue" data-slot="${s.index}">
      <div class="idx">slot ${s.index + 1}</div>
      <div><span class="dot"></span><b style="font-size:13px">${t('searching')}…</b></div>
      <div class="sub">${s.position ? `queue #${s.position}` : 'waiting'} · tap to cancel</div>
    </button>`;
  }
  return `<button class="slot empty" data-act="queue" data-slot="${s.index}">
    <div class="idx">slot ${s.index + 1}</div>
    <div class="big" style="color:var(--teal)">Find my match</div>
    <div class="sub">${t('tapstart')}</div>
  </button>`;
}

function viewRun() {
  const r = S.run, t = r.test, i = r.i, item = t.items[i];
  const ans = r.answers[item.id] != null;
  const body = t.kind === 'scale'
    ? `<div class="scale">${[1,2,3,4,5].map(v => `<button data-act="ans" data-v="${v}" aria-pressed="${r.answers[item.id] === v}">${v}</button>`).join('')}</div>
       <div class="slegend"><span>${esc(t.scale[0])}</span><span>${esc(t.scale[4])}</span></div>`
    : item.options.map((o, oi) => `<button class="opt" data-act="ans" data-v="${oi}" aria-pressed="${r.answers[item.id] === oi}">${esc(o)}</button>`).join('');
  return `<button class="back" data-act="closetest">← ${esc(t.title)}</button>
    <div class="hd"><span class="lbl">${i + 1} of ${t.items.length}</span><span class="lbl">${t.weight}% of score</span></div>

      <button class="ghost" data-act="prevq" ${i === 0 ? 'disabled' : ''}>Back</button>
      <button class="p" data-act="nextq" ${ans ? '' : 'disabled'}>${i === t.items.length - 1 ? 'Finish' : 'Next'}</button>
    </div>`;
}
function viewResult() {
  const { test: t, result: r, cibil } = S.run;
  const s = r.summary || {};
  const bits = [];
  if (t.id === 'type') bits.push('Type ' + s.type);
  if (t.id === 'attach') bits.push('Attachment: ' + s.style);
  if (t.id === 'enneagram') bits.push('Enneagram type ' + s.ennea);
  if (t.id === 'conflict') bits.push('Conflict: ' + s.conflict);
  return `<div class="card" style="text-align:center;background:var(--teal-soft);border-color:transparent">

}

/* ------------------------------ actions ------------------------------ */
document.addEventListener('click', async (e) => {
  const cityRow = e.target.closest('.cityrow[data-city]');
  if (cityRow) {
    const which = cityRow.dataset.list === 'e-city-list' ? 'e-city' : 'a-city';
    const input = document.getElementById(which);
    if (input) input.value = cityRow.dataset.city;
    const picked = { name: cityRow.dataset.city, state: cityRow.dataset.state };
    const box = document.getElementById(cityRow.dataset.list);
    if (box) box.style.display = 'none';
    if (which === 'a-city') {
      placePicked = picked;
      $('#city-confirm').textContent = `${picked.name}${picked.state ? ', ' + picked.state : ''} · ${(+cityRow.dataset.lat).toFixed(2)}°N, ${(+cityRow.dataset.lon).toFixed(2)}°E · IST`;
    } else {
      editPlacePicked = picked;
    }
    return;
  }

  const el = e.target.closest('[data-act],[data-g],[data-p]');
  if (!el) return;
  if (el.dataset.g) { document.querySelectorAll('#a-gender button').forEach(b => b.setAttribute('aria-pressed', b === el)); S.gender = el.dataset.g; return; }
  if (el.dataset.p) { document.querySelectorAll('#a-pref button').forEach(b => b.setAttribute('aria-pressed', b === el)); S.pref = el.dataset.p; return; }
  if (el.dataset.ep) { document.querySelectorAll('#e-pref button').forEach(b => b.setAttribute('aria-pressed', b === el)); S.editPref = el.dataset.ep; return; }
  const act = el.dataset.act;
  const guard = async fn => { if (S.busy) return; S.busy = true; try { await fn(); } catch (err) { toast(err.message); } finally { S.busy = false; } };

  switch (act) {
    case 'openavatar': openAvatar(); break;

    case 'avopt': {
      S.av = S.av || {};
      S.av[el.dataset.k] = Number(el.dataset.v);
      refreshAvatar();
      break;
    }

    case 'avshuffle': {
      const pick = n => Math.floor(Math.random() * n);
      S.av = { skin: pick(AV.skin.length), hairColor: pick(AV.hairColor.length), hair: pick(AV.hair.length),
               eyes: pick(AV.eyes.length), brow: pick(AV.brow.length), mouth: pick(AV.mouth.length),
               glasses: pick(AV.glasses.length), hat: pick(AV.hat.length) };
      refreshAvatar();
      break;
    }

    case 'avsave': await guard(async () => {
      const r = await api('/api/avatar', { method: 'POST', body: S.av });
      S.me.user.avatar = r.avatar;
      closeSheet(); render(); toast('Avatar saved');
    }); break;

    case 'setlang':
      S.lang = el.dataset.v;
      localStorage.setItem('milao_lang', S.lang);
      await guard(async () => { if (S.token) await loadTests(); });
      render();
      break;

    case 'togglepw': {
      const inp = document.getElementById(el.dataset.target);
      if (!inp) break;
      const showing = inp.type === 'text';
      inp.type = showing ? 'password' : 'text';
      el.classList.toggle('on', !showing);
      break;
    }
    case 'authmode': S.authMode = el.dataset.v; render(); break;

    case 'signup': await guard(async () => {
      const body = {
        email: $('#a-email').value, password: $('#a-pass').value, name: $('#a-name').value,
        status: $('#a-status').value, gender: S.gender, pref: S.pref,
        dob: $('#a-dob').value, tob: $('#a-tob').value,
        city: placePicked ? placePicked.name : $('#a-city').value
      };
      const r = await api('/api/signup/start', { method: 'POST', body });
      S.pendingEmail = body.email.trim().toLowerCase();
      S.devCode = r.devCode || null;
      S.authMode = 'otp'; render();
      toast('Code sent');
    }); break;

    case 'verifyotp': await guard(async () => {
      const r = await api('/api/signup/verify', { method: 'POST', body: { email: S.pendingEmail, code: $('#o-code').value.trim() } });
      S.token = r.token; localStorage.setItem('milao_token', r.token);
      S.devCode = null; S.authMode = 'signup';
      await boot(); toast('Verified. Build your character.');
    }); break;

    case 'forgot': await guard(async () => {
      await api('/api/password/forgot', { method: 'POST', body: { email: $('#r-email').value } });
      S.resetEmail = $('#r-email').value.trim().toLowerCase();
      S.resetSent = true; render(); toast('If that email exists, a code is on its way');
    }); break;

    case 'resetpass': await guard(async () => {
      const r = await api('/api/password/reset', { method: 'POST', body: {
        email: S.resetEmail, code: $('#r-code').value.trim(), password: $('#r-pass').value
      }});
      S.token = r.token; localStorage.setItem('milao_token', r.token);
      S.resetSent = false; S.authMode = 'login';
      await boot(); toast('Password changed');
    }); break;

    case 'login': await guard(async () => {
      const r = await api('/api/login', { method: 'POST', body: { email: $('#a-email').value, password: $('#a-pass').value } });
      S.token = r.token; localStorage.setItem('milao_token', r.token);
      await boot(); toast('Back in.');
    }); break;

    case 'logout': localStorage.removeItem('milao_token'); S.token = null; S.me = null; S.chat = null; stopPoll(); render(); break;
    case 'tab': S.tab = el.dataset.tab; render(); break;

    case 'queue': await guard(async () => {
      await api('/api/queue/join', { method: 'POST', body: { slot: Number(el.dataset.slot) } });
      await refreshState();
    }); break;

    case 'unqueue': await guard(async () => {
      await api('/api/queue/leave', { method: 'POST', body: { slot: Number(el.dataset.slot) } });
      await refreshState();
    }); break;

    case 'openchat': await guard(async () => {
      const r = await api('/api/chats/' + el.dataset.id);
      S.chat = r.chat; S.draft = ''; render(); startChatPoll();
    }); break;

    case 'closechat': S.chat = null; stopChatPoll(); await refreshState(); render(); break;

    case 'sendmsg': await guard(async () => {
      const box = $('#msgbox'); const text = box.value.trim(); if (!text) return;
      const r = await api(`/api/chats/${S.chat.id}/messages`, { method: 'POST', body: { text } });
      S.chat = r.chat; S.draft = ''; render();
      const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight;
    }); break;

    case 'reportmenu': openReport(); break;

    case 'report': await guard(async () => {
      const reason = el.dataset.reason;
      closeSheet();
      const r = await api(`/api/chats/${S.chat.id}/report`, { method: 'POST', body: { reason } });
      toast(r.suspended ? 'Reported. Account suspended pending review.' : 'Reported. It costs them.');
      S.chat = null; stopChatPoll(); await refreshState(); render();
    }); break;

    case 'leavechat': await guard(async () => {
      closeSheet();
      const r = await api(`/api/chats/${S.chat.id}/leave`, { method: 'POST', body: {} });
      S.chat = r.chat; render(); toast('You left the chat');   // no penalty shown — it is backend only
    }); break;

    case 'closesheet': if (e.target.closest('.inner')) return; closeSheet(); break;

    case 'editprofile': openEdit(); break;
    case 'saveprofile': await guard(async () => {
      await api('/api/profile', { method: 'POST', body: {
        name: $('#e-name').value, status: $('#e-status').value,
        dob: $('#e-dob').value, tob: $('#e-tob').value,
        city: editPlacePicked ? editPlacePicked.name : $('#e-city').value, pref: S.editPref || S.me.user.pref
      }});
      S.editPref = null;
      closeSheet(); await refreshMe(); render();
      toast('Saved — chart recalculated');
    }); break;

    case 'opentest': {
      const t = (S.tests || []).find(x => x.id === el.dataset.id);
      S.run = { test: t, i: 0, answers: {}, result: null }; render(); break;
    }
    case 'ans': {
      const r = S.run; r.answers[r.test.items[r.i].id] = Number(el.dataset.v);
      if (r.test.kind === 'choice' && r.i < r.test.items.length - 1) r.i++;
      render(); break;
    }
    case 'nextq': {
      const r = S.run, item = r.test.items[r.i];
      if (r.answers[item.id] == null) return;
      if (r.i < r.test.items.length - 1) { r.i++; render(); }
      else await guard(async () => {
        const out = await api('/api/tests/' + r.test.id, { method: 'POST', body: { answers: r.answers } });
        r.result = out.result; r.cibil = out.cibil;
        await refreshMe(); render();
      });
      break;
    }
    case 'prevq': if (S.run.i > 0) { S.run.i--; render(); } break;
    case 'closetest': S.run = null; S.tab = 'tests'; render(); break;
  }
});

const DEV = [
  ['क़','q'],['ख़','kh'],['ग़','g'],['ज़','z'],['ड़','r'],['ढ़','rh'],['फ़','f'],
  ['क','k'],['ख','kh'],['ग','g'],['घ','gh'],['ङ','ng'],
  ['च','ch'],['छ','chh'],['ज','j'],['झ','jh'],['ञ','n'],
  ['ट','t'],['ठ','th'],['ड','d'],['ढ','dh'],['ण','n'],
  ['त','t'],['थ','th'],['द','d'],['ध','dh'],['न','n'],
  ['प','p'],['फ','ph'],['ब','b'],['भ','bh'],['म','m'],
  ['य','y'],['र','r'],['ल','l'],['व','v'],['श','sh'],['ष','sh'],['स','s'],['ह','h'],['ळ','l'],
  ['आ','aa'],['इ','i'],['ई','ee'],['उ','u'],['ऊ','oo'],['ऋ','ri'],['ए','e'],['ऐ','ai'],['ओ','o'],['औ','au'],['अ','a'],

  ['ं','n'],['ँ','n'],['ः','h'],['्',''],['।','.'],['ॐ','om']
];
function translit(s) {
  if (!s) return s;
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === ' ' || ch === '\n' || /[0-9a-zA-Z.,;:!?()\-–—…"%/]/.test(ch)) { out += ch; continue; }
    let hit = null;
    for (const [d, l] of DEV) { if (s.startsWith(d, i)) { hit = [d, l]; break; } }
    if (hit) { out += hit[1]; i += hit[0].length - 1; }
    else out += ch;
  }
  return out;
}

  // hair on top
  if (hairStyle === 'crop' || hairStyle === 'long' || hairStyle === 'pony' || hairStyle === 'bun')
    s += `<path d="M25 48 q0 -27 25 -27 q25 0 25 27 q-5 -15 -25 -15 q-20 0 -25 15 z" fill="${hc}"/>`;
  if (hairStyle === 'side')
    s += `<path d="M25 47 q2 -26 25 -26 q21 0 25 20 q-15 -9 -27 -5 q-13 4 -23 11 z" fill="${hc}"/>`;
  if (hairStyle === 'curly')
    s += `<g fill="${hc}"><circle cx="32" cy="34" r="8"/><circle cx="44" cy="28" r="9"/><circle cx="56" cy="28" r="9"/><circle cx="68" cy="34" r="8"/><circle cx="27" cy="44" r="6"/><circle cx="73" cy="44" r="6"/></g>`;
  if (hairStyle === 'spiky')
    s += `<path d="M26 46 l5 -12 l6 7 l5 -14 l6 11 l5 -13 l6 12 l5 -8 l6 13 q-22 -8 -44 4 z" fill="${hc}"/>`;

  // brows
  const browY = 44;
  if (browStyle === 'flat') s += `<rect x="35" y="${browY}" width="11" height="2.6" rx="1.3" fill="${INK}"/><rect x="54" y="${browY}" width="11" height="2.6" rx="1.3" fill="${INK}"/>`;
  if (browStyle === 'arch') s += `<path d="M35 ${browY+2} q5 -5 11 0" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M54 ${browY+2} q5 -5 11 0" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  if (browStyle === 'thick') s += `<rect x="34" y="${browY-1}" width="13" height="4.4" rx="2.2" fill="${INK}"/><rect x="53" y="${browY-1}" width="13" height="4.4" rx="2.2" fill="${INK}"/>`;

  // eyes
  if (eyeStyle === 'dot') s += `<circle cx="41" cy="52.5" r="4" fill="${INK}"/><circle cx="59" cy="52.5" r="4" fill="${INK}"/><circle cx="42.4" cy="51.2" r="1.2" fill="#fff" opacity=".85"/><circle cx="60.4" cy="51.2" r="1.2" fill="#fff" opacity=".85"/>`;
  if (eyeStyle === 'round') s += `<circle cx="41" cy="52.5" r="6.4" fill="#fff" stroke="${INK}" stroke-width="1.2"/><circle cx="59" cy="52.5" r="6.4" fill="#fff" stroke="${INK}" stroke-width="1.2"/><circle cx="41.6" cy="53" r="3.2" fill="${INK}"/><circle cx="59.6" cy="53" r="3.2" fill="${INK}"/>`;
  if (eyeStyle === 'sleepy') s += `<path d="M36.5 53 q4.5 3.5 9 0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M54.5 53 q4.5 3.5 9 0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  if (eyeStyle === 'happy') s += `<path d="M36.5 55 q4.5 -6 9 0" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M54.5 55 q4.5 -6 9 0" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;

  // mouth
  if (mouthStyle === 'smile') s += `<path d="M39 64 q11 11 22 0" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if (mouthStyle === 'small') s += `<path d="M45 66 q5 4 10 0" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  if (mouthStyle === 'neutral') s += `<rect x="43" y="66" width="14" height="2.6" rx="1.3" fill="${INK}"/>`;
  if (mouthStyle === 'open') s += `<path d="M42 64 q8 -3 16 0 q-2 8 -8 8 q-6 0 -8 -8 z" fill="${INK}"/>`;
  if (mouthStyle === 'smirk') s += `<path d="M42 67 q7 5 16 -1" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;

  // glasses
  if (glassesStyle === 'round') s += `<g fill="none" stroke="${INK}" stroke-width="2"><circle cx="41" cy="53" r="8.5"/><circle cx="59" cy="53" r="8.5"/><path d="M49.5 53 h1"/><path d="M32.5 52 l-4 -2"/><path d="M67.5 52 l4 -2"/></g>`;
  if (glassesStyle === 'square') s += `<g fill="none" stroke="${INK}" stroke-width="2"><rect x="32.5" y="45.5" width="17" height="14" rx="4"/><rect x="50.5" y="45.5" width="17" height="14" rx="4"/><path d="M49.5 52 h1"/></g>`;

  // hat
  if (hatStyle === 'cap') s += `<path d="M24 40 q0 -22 26 -22 q26 0 26 22 z" fill="${hc}"/><rect x="20" y="38" width="60" height="5" rx="2.5" fill="${hc}"/>`;
  if (hatStyle === 'beanie') s += `<path d="M25 42 q0 -25 25 -25 q25 0 25 25 z" fill="${hc}"/><rect x="24" y="38" width="52" height="6" rx="3" fill="${hc}" opacity=".75"/>`;

  s += `</svg>`;
  return s;
}

function avatarchip(a, size = 34) {
  return `<span class="avchip">${avatarSVG(a, size)}</span>`;
}

/* ---------- India place search ---------- */
let PLACES = null, placePicked = null, editPlacePicked = null;
async function loadPlaces() {
  if (PLACES) return;
  try { PLACES = await (await fetch('/geo.json')).json(); } catch { PLACES = []; }
}
function showCities(q, listId = 'city-list') {
  const box = document.getElementById(listId); if (!box || !PLACES) return;
  const s = String(q || '').trim().toLowerCase();
  if (s.length < 2) { box.style.display = 'none'; box.innerHTML = ''; return; }
  const starts = PLACES.filter(p => p[0].toLowerCase().startsWith(s));
  const extra = starts.length >= 8 ? [] : PLACES.filter(p => p[0].toLowerCase().includes(s) && !p[0].toLowerCase().startsWith(s));
  const hits = [...starts, ...extra].slice(0, 8);
  if (!hits.length) { box.innerHTML = '<div class="cityrow">No place found — try another spelling</div>'; box.style.display = 'block'; return; }
  box.innerHTML = hits.map(p => `<div class="cityrow" data-list="${listId}" data-city="${esc(p[0])}" data-state="${esc(p[1] || '')}" data-lat="${p[2]}" data-lon="${p[3]}">${esc(p[0])}${p[1] ? `<span>${esc(p[1])}</span>` : ''}</div>`).join('');
  box.style.display = 'block';
}
document.addEventListener('input', e => {
  if (e.target.id === 'a-city') { placePicked = null; $('#city-confirm').textContent = ''; showCities(e.target.value, 'city-list'); }
  if (e.target.id === 'e-city') { editPlacePicked = null; showCities(e.target.value, 'e-city-list'); }
});

let lastTyping = 0;
document.addEventListener('input', e => {
  if (e.target.id !== 'msgbox' || !S.chat) return;
  const t = Date.now();
  if (t - lastTyping < 2500) return;
  lastTyping = t;
  api('/api/chats/' + S.chat.id + '/typing', { method: 'POST' }).catch(() => {});
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'msgbox') { e.preventDefault(); document.querySelector('[data-act="sendmsg"]')?.click(); }
});

/* ------------------------------ sheets ------------------------------ */
function closeSheet() { $('#sheet').innerHTML = ''; }
function openReport() {
  $('#sheet').innerHTML = `<div class="sheet" data-act="closesheet"><div class="inner">
    <h3 style="margin-bottom:10px">${t('chatoptions')}</h3>
    <button class="p w" data-act="leavechat">${t('leavechat')}</button>
    <p class="tiny" style="margin:10px 0 8px">The other person keeps their place.</p>
    <p class="lbl" style="margin-bottom:6px">${t('report')}</p>
    ${['Rude or abusive', 'Spam or selling', 'Underage', 'Something else'].map(r =>
      `<button class="opt" data-act="report" data-reason="${esc(r.toLowerCase())}">${esc(r)}</button>`).join('')}
    <button class="ghost w" data-act="closesheet" style="margin-top:4px">Cancel</button>
  </div></div>`;
}
function openAvatar() {
  const cur = S.me.user.avatar || { skin: 2, hairColor: 0, hair: 1, eyes: 0, brow: 0, mouth: 0, glasses: 0, hat: 0 };
  S.av = Object.assign({}, cur);
  const row = (k, label, list, colours) => `
    <p class="lbl" style="margin:14px 0 7px">${label}</p>
    <div class="opts" data-group="${k}">${list.map((v, i) => colours
      ? `<button class="sw ${S.av[k] === i ? 'on' : ''}" data-act="avopt" data-k="${k}" data-v="${i}" style="background:${v}" aria-label="${label} ${i + 1}"></button>`
      : `<button class="chip ${S.av[k] === i ? 'on' : ''}" data-act="avopt" data-k="${k}" data-v="${i}">${v}</button>`).join('')}</div>`;
  $('#sheet').innerHTML = `<div class="sheet" data-act="closesheet"><div class="inner">
    <h3 style="margin-bottom:2px">Your avatar</h3>
    <p class="tiny" style="margin-bottom:10px">Tap a part to change it. Shuffle until it looks like you-ish.</p>
    <div class="body">
      <div id="avpreview" style="display:flex;justify-content:center;margin:4px 0 6px">${avatarSVG(S.av, 132)}</div>
      ${row('skin', 'skin', AV.skin, true)}
      ${row('hair', 'hair', AV.hair, false)}
      ${row('hairColor', 'hair colour', AV.hairColor, true)}
      ${row('eyes', 'eyes', AV.eyes, false)}
      ${row('mouth', 'mouth', AV.mouth, false)}
      ${row('brow', 'brows', AV.brow, false)}
      ${row('glasses', 'glasses', AV.glasses, false)}
      ${row('hat', 'hat', AV.hat, false)}
    </div>
    <div class="foot">
      <button class="ghost" style="flex:1" data-act="avshuffle">Shuffle</button>
      <button class="p" style="flex:2" data-act="avsave">Save avatar</button>
    </div>
  </div></div>`;
}

/* update only what changed — no rebuild, so the scroll position stays put */
function refreshAvatar() {
  const pv = document.getElementById('avpreview');
  if (pv) pv.innerHTML = avatarSVG(S.av, 132);
  for (const [k, v] of Object.entries(S.av)) {
    const group = document.querySelector(`.opts[data-group="${k}"]`);
    if (!group) continue;
    [...group.children].forEach((b, i) => b.classList.toggle('on', i === v));
  }
}

function openEdit() {
  loadPlaces();
  const u = S.me.user, c = S.me.chart;
  $('#sheet').innerHTML = `<div class="sheet" data-act="closesheet"><div class="inner" style="max-height:88vh;overflow-y:auto">
    <h3 style="margin-bottom:4px">Edit your details</h3>
    <p class="tiny" style="margin-bottom:12px">Change your birth date, time or place and the whole chart is recalculated.</p>
    <label class="f"><span>name</span><input id="e-name" maxlength="24" value="${esc(u.name)}"></label>
    <label class="f"><span>status — 50 characters</span><input id="e-status" maxlength="50" value="${esc(S.me.status || '')}"></label>
    <div class="row">
      <label class="f"><span>birth date</span><input id="e-dob" type="date" value="${esc(c.dob || '')}"></label>
      <label class="f"><span>birth time</span><input id="e-tob" type="time" value="${esc(S.me.tob || '')}"></label>
    </div>
    <label class="f"><span>birth place</span><input id="e-city" value="${esc(u.city)}" autocomplete="off"></label>
    <div class="citylist" id="e-city-list"></div>
    <label class="f"><span>show me</span>
      <div class="seg" id="e-pref">${['Men','Women','Anyone'].map(p => `<button data-ep="${p}" aria-pressed="${u.pref === p}">${p}</button>`).join('')}</div>
    </label>
    <p class="tiny" style="margin-bottom:10px">${c.place && !c.place.known ? 'That birth place is not recognised — try the nearest large city, or the ascendant will be off.' : 'Birth time is optional. Without it the ascendant is approximate.'}</p>
    <button class="p w" data-act="saveprofile">Save changes</button>
    <button class="ghost w" data-act="closesheet" style="margin-top:8px">Cancel</button>
  </div></div>`;
}

/* ------------------------------ polling ------------------------------ */
let lastStateJSON = '';
let seenChats = null;
async function refreshState() {
  try {
    const st = await api('/api/state');
    const json = JSON.stringify(st);
    const changed = json !== lastStateJSON;
    lastStateJSON = json;
    S.state = st;
    // a new chat should pull you to the board, wherever you were
    const ids = st.slots.map(s => s.chatId).filter(Boolean);
    if (!seenChats) { seenChats = new Set(ids); }          // don't jump on first load
    else {
      const fresh = ids.filter(id => !seenChats.has(id));
      ids.forEach(id => seenChats.add(id));
      if (fresh.length && !S.chat) {
        toast('You have a match');
        if (S.tab !== 'home') S.tab = 'home';
      }
    }
    if (changed) render();
  } catch (err) { if (err.code === 401) logout(); }
}
async function refreshMe() { S.me = await api('/api/me'); }
function startPoll() { stopPoll(); S.poll = setInterval(() => { if (S.token && !S.chat) refreshState(); }, 2200); }
function stopPoll() { if (S.poll) clearInterval(S.poll); S.poll = null; }
function startChatPoll() {
  stopChatPoll();
  S.chatPoll = setInterval(async () => {
    if (!S.chat) return stopChatPoll();
    try {
      const r = await api('/api/chats/' + S.chat.id);
      if (JSON.stringify(r.chat.messages) !== JSON.stringify(S.chat.messages) ||
          r.chat.endedAt !== S.chat.endedAt ||
          !!r.chat.peerTyping !== !!S.chat.peerTyping) {
        S.chat = r.chat; render(); scrollMsgs();
      }
    } catch {}
  }, 1600);
}
function stopChatPoll() { if (S.chatPoll) clearInterval(S.chatPoll); S.chatPoll = null; }
function scrollMsgs() { const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight; }
function logout() { localStorage.removeItem('milao_token'); S.token = null; S.me = null; stopPoll(); render(); }

async function loadTests() {
  const lang = (S.lang === 'hi' || S.lang === 'hinglish') ? 'hi' : 'en';
  let tests = (await api('/api/tests?lang=' + lang)).tests;
  if (S.lang === 'hinglish') {
    tests = tests.map(t => Object.assign({}, t, {
      title: translit(t.title), blurb: translit(t.blurb),
      items: t.items.map(it => Object.assign({}, it, {
        text: translit(it.text),
        options: (it.options || []).map(o => translit(o))
      }))
    }));
  }
  S.tests = tests;
}

async function boot() {
  loadPlaces();
  try {
    await refreshMe();
    await loadTests();
    S.tab = Object.keys(S.me.results || {}).length < (S.tests ? S.tests.length : 5) ? 'tests' : 'home';
    render();
    await refreshState();
    startPoll();
  } catch (err) {
    if (err.code === 401) logout(); else { toast(err.message); render(); }
  }
}

if (S.token) boot(); else render();
</script>

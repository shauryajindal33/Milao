# Create the service by hand (New → Web Service). These are the settings it needs.
# Free plan sleeps and has no disk — with Postgres attached the data still survives,
# because it lives in Neon, not on the instance.
services:
  - type: web
    name: milao
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # paste the Neon connection string
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false          # e.g. Milao <hello@yourdomain.com>
      - key: ADMIN_TOKEN
        generateValue: true

# Render blueprint. Free plan works but has NO disk: every restart wipes accounts.
# For anything you care about, use plan: starter and keep the disk block below.
services:
  - type: web
    name: milao
    runtime: node
    plan: starter
    region: singapore
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SEED
        value: "0"
      - key: ADMIN_TOKEN
        generateValue: true
    disk:
      name: milao-data
      mountPath: /var/data
      sizeGB: 1
